schema_version = 1
name = "rsue-paper-choice-edge-legacy-ports-control"

[input]
adapter = "rsue_frozen_2026_07_12"
data_root = "${RSUE_DATA_ROOT}"
manifest = "input_manifest.toml"
mode_order = ["road", "rail", "water_dom", "water_for"]

[input.transformations]
domestic_nodes = 228
padded_foreign_nodes = 6
symmetrize_modes = true
normalize_mode_matrices = true
apply_rsue_modal_weights = true
filter_rail_by_terminal_count = true
foreign_node_closure = "fixed_supply_demand_us_welfare"

[model]
alpha = 0.10
beta = -0.30
sigma = 9.0
eta = 1.099
modal_specification = "choice_logsum"
route_curvature = "theorem"
active_transport_modes = ["road", "rail", "water_dom", "water_for"]
external_nodes = ["229", "230", "231", "232", "233", "234"]

[congestion]
specification = "edge"

[congestion.edge]
road = 0.092

[policy]
mode = "road"
unit = "both"
shock_fraction = 0.01

[output]
directory = "output/rsue_paper_choice_edge_legacy_ports_control"

[diagnostics]
tolerance = 1.0e-10
condition_limit = 1.0e12

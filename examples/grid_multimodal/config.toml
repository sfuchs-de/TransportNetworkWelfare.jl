schema_version = 1
name = "multimodal-grid"

[input]
adapter = "generic_csv_v1"
nodes = "data/nodes.csv"
edge_modes = "data/edge_modes.csv"
mode_order = ["road", "transit"]

[input.transformations]
normalize_labor = true
normalize_income = true
flow_conversion = "none"
symmetrize = false
pad_nodes = 0
modal_rescale = false

[model]
spatial_specification = "economic_geography"
alpha = 0.10
beta = -0.30
sigma = 9.0
eta = 1.099
modal_specification = "choice_logsum"
route_curvature = "theorem"

[congestion]
specification = "composite"
endpoint_scale = 1.0

[congestion.edge]
road = 0.08

[congestion.terminal]
transit = 0.025

[policy]
mode = "road"
unit = "both"
shock_fraction = 0.01

[output]
directory = "output"

[diagnostics]
tolerance = 1.0e-10
condition_limit = 1.0e12

[sensitivity]
eta = [0.75, 1.099, 1.40]

schema_version = 1
name = "cow-mesh-edge-local"

[input]
adapter = "generic_csv_v1"
nodes = "mesh_data/nodes.csv"
edge_modes = "mesh_data/edge_modes.csv"
mode_order = ["road"]

[input.transformations]
normalize_labor = true
normalize_income = true
flow_conversion = "none"
symmetrize = false
pad_nodes = 0
modal_rescale = false

[model]
alpha = 0.08
beta = -0.12
sigma = 5.0
eta = 1.099
modal_specification = "choice_logsum"
route_curvature = "theorem"

[congestion]
specification = "edge"

[congestion.edge]
road = 0.12

[policy]
mode = "road"
unit = "both"
shock_fraction = 0.01

[output]
directory = "mesh_output"

[diagnostics]
tolerance = 1.0e-9
condition_limit = 1.0e12

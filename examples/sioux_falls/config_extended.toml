schema_version = 1
name = "sioux-falls-bpr-local"

[input]
adapter = "generic_csv_v1"
nodes = "generated/nodes.csv"
edge_modes = "generated/edge_modes.csv"
mode_order = ["road"]

[input.transformations]
normalize_labor = true
normalize_income = true
flow_conversion = "none"
symmetrize = false
pad_nodes = 0
modal_rescale = false

[model]
alpha = 0.05
beta = -0.10
sigma = 5.0
eta = 1.099
modal_specification = "choice_logsum"
route_curvature = "theorem"

[congestion]
specification = "edge"
source = "input_column"
column = "congestion_elasticity"
scale = 1.0

[policy]
mode = "road"
unit = "both"
shock_fraction = 0.01

[output]
directory = "output-extended"

[diagnostics]
tolerance = 1.0e-10
condition_limit = 1.0e12

[sensitivity]
edge_congestion_scale = [0.0, 0.5, 1.0, 1.5]

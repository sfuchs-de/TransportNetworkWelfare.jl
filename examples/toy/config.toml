schema_version = 1
name = "three-node-toy"

[input]
adapter = "generic_csv_v1"
nodes = "data/nodes.csv"
edge_modes = "data/edge_modes.csv"
mode_order = ["road", "rail"]

[input.transformations]
normalize_labor = true
normalize_income = true
flow_conversion = "none"
symmetrize = false
pad_nodes = 0
modal_rescale = false

[model]
alpha = 0.10
beta = -0.30
sigma = 9.0
eta = 1.099
modal_specification = "choice_logsum"
route_curvature = "theorem"

[congestion]
specification = "composite"
endpoint_scale = 1.0

[congestion.edge]
road = 0.05

[congestion.terminal]
rail = 0.03

[policy]
mode = "road"
unit = "both"
shock_fraction = 0.01

[output]
directory = "output"

[diagnostics]
tolerance = 1.0e-10
condition_limit = 1.0e12

[sensitivity]
alpha = [0.04, 0.07, 0.10, 0.13, 0.145]
beta = [-0.36, -0.33, -0.30, -0.27, -0.25]
net_dispersion = [0.17, 0.185, 0.20, 0.23, 0.26]
eta = [0.70, 0.90, 1.099, 1.30, 1.50]
common_congestion = [0.0, 0.5, 1.0, 1.5, 2.0]
lambda_road = [0.0, 0.025, 0.05, 0.075, 0.10]
lambda_terminal = [0.0, 0.015, 0.03, 0.045, 0.06]

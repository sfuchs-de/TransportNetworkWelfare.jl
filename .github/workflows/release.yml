name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plots/requirements.txt
      - name: Install dependencies
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          python -m pip install -r plots/requirements.txt
          sudo apt-get update
          sudo apt-get install -y file latexmk lmodern poppler-utils qpdf texlive-fonts-recommended texlive-latex-extra texlive-pictures
      - name: Check tag and release metadata
        run: python scripts/check_release_metadata.py --tag "$GITHUB_REF_NAME"
      - name: Test package and independent oracle
        run: |
          julia --project=. -e 'using Pkg; Pkg.test()'
          python test/verify_prop2.py
      - name: Build release artifacts
        run: make release-artifacts
      - name: Check provenance and repository contents
        run: |
          python scripts/verify_provenance.py
          python scripts/scan_secrets.py
          git diff --check
      - name: Create GitHub release and attach guide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/TransportNetworkWelfare-Practitioner-Guide.pdf \
            dist/TransportNetworkWelfare-Practitioner-Guide.sha256 \
            --clobber

name: CI

permissions:
  contents: read

concurrency:
  group: tnw-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  julia:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        julia-version: ['1.10', '1']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Test
        run: julia --project=. -e 'using Pkg; Pkg.test()'
      - name: CLI smoke test
        run: julia --project=. bin/tnw.jl decompose examples/toy/config.toml
      - name: Canonical example smoke tests
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1.10'
        run: |
          julia --project=. bin/tnw.jl decompose examples/braess/config.toml
          julia --project=. bin/tnw.jl decompose examples/cow/config.toml
          julia --project=. bin/tnw.jl analyze-edge-local examples/cow/config.toml
      - name: Independent choice-logsum nonlinear check
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1.10'
        run: julia --project=. replication/rsue/verify_choice_logsum_fd.jl examples/toy/config.toml /tmp/choice-logsum-fd.toml

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Build documentation
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate(); include("docs/make.jl")'

  practitioner-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plots/requirements.txt
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Install plotting dependencies
        run: python -m pip install -r plots/requirements.txt
      - name: Install TeX and PDF checks
        run: |
          sudo apt-get update
          sudo apt-get install -y file latexmk lmodern poppler-utils qpdf texlive-fonts-recommended texlive-latex-extra texlive-pictures
      - name: Build and check practitioner guide
        run: make practitioner-guide-check
      - name: Upload practitioner guide
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TransportNetworkWelfare-Practitioner-Guide
          path: docs/practitioner-guide/build/TransportNetworkWelfare-Practitioner-Guide.pdf

  census-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test Census port pipeline
        run: python -m unittest discover -s replication/rsue/census_ports -p 'test_*.py'

  python-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r verification/requirements-linux.txt
      - run: python test/verify_prop2.py
      - run: python -m unittest replication.rsue.test_paper_artifacts

  plots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: '1.10'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plots/requirements.txt
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=. bin/tnw.jl decompose examples/toy/config.toml
      - run: julia --project=. bin/tnw.jl decompose examples/cow/config.toml
      - run: python -m pip install -r plots/requirements.txt
      - run: make plot-check
      - run: python plots/hulten_vs_welfare.py examples/toy/output/decomposition_directed.csv /tmp/hulten.png
      - run: python plots/decomposition_components.py examples/toy/output/decomposition_directed.csv /tmp/components.png
      - run: python plots/network_example.py examples/cow/data/nodes.csv examples/cow/data/edge_modes.csv examples/cow/output/decomposition_physical.csv /tmp/cow.png --metric primitive_F --transparent --three-dimensional --cow-surface --elevation-angle 14 --azimuth -70

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/scan_secrets.py
      - run: python scripts/verify_provenance.py
      - run: python scripts/check_release_metadata.py
      - run: git diff --check
